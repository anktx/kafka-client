name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: rdkafka
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Style check (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=dots

      - name: Static analysis (PHPStan level 8 + strict-rules)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite=Unit

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: rdkafka
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.4-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Infection
        run: vendor/bin/infection --no-progress --show-mutations

      - name: Upload Infection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-log
          path: .infection/log.txt
          if-no-files-found: ignore

  integration:
    name: Integration tests (RedPanda)
    runs-on: ubuntu-latest
    needs: qa

    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.3.13
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health --exit-when-healthy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      KAFKA_BROKERS: localhost:9092

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: rdkafka
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.4-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Страховка от «вечно-зелёных» прогонов: если брокер так и не поднялся,
      # job падает здесь, а не молча скользит мимо skip-логики тестов.
      - name: Wait for Kafka broker
        run: |
          for i in $(seq 1 30); do
            if php -r 'exit(@fsockopen("localhost", 9092, $e, $s, 2) ? 0 : 1);'; then
              echo "Kafka broker is up"
              exit 0
            fi
            sleep 2
          done
          echo "Kafka broker did not become available in time"
          exit 1

      - name: Integration tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite=Integration --colors=never
