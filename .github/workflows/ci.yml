name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: rdkafka
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Style check (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=dots

      - name: Static analysis (PHPStan level 8 + strict-rules)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite=Unit

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: rdkafka
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Infection
        run: vendor/bin/infection --no-progress --show-mutations
